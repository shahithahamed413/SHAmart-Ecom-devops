services:
  database:
    env_file:
      - ./database/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    image: shahith/shamart-db:v3
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "ap-south-1a"
        awslogs-group: "/aws/ec2/shamart-app"
        awslogs-stream: "database-service"

  backend:
    env_file:
      - ./backend/.env.compose
    image: shahith/shamart-backend
    depends_on:
      - database
    ports:
      - "${API_PORT:-8000}:8000"
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "ap-south-1a"
        awslogs-group: "/aws/ec2/shamart-app"
        awslogs-stream: "backend-service"

  frontend:
    image: shahith/shamart-ui:v2
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "ap-south-1a"
        awslogs-group: "/aws/ec2/shamart-app"
        awslogs-stream: "frontend-service"

volumes:
  mysql_data: