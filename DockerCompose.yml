services:
  database:
    env_file:
      - ./database/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    build:
      context: ./database
      dockerfile: Dockerfile
    image: shamart-db:v3
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    env_file:
      - ./backend/.env.compose
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: shamart-backend
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    image: shamart-ui:v2
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  mysql_data:
